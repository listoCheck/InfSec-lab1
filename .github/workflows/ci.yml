name: Secure API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sast-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NVD_DATAFEED_URL: https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore NVD database
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-feed-${{ runner.os }}-13-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nvd-feed-${{ runner.os }}-13-
      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain
      - name: SAST — SpotBugs security rules
        run: |
          ./gradlew spotbugsMain --no-daemon --console=plain
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/reports/spotbugs/main.xml').getroot()
          summary = root.find('FindBugsSummary')
          if summary is None or int(summary.get('total_classes', '0')) == 0:
              raise SystemExit('SpotBugs did not analyze any application classes')
          errors = root.find('Errors')
          if errors is not None and any(int(errors.get(key, '0')) for key in ('errors', 'missingClasses')):
              raise SystemExit('SpotBugs analysis is incomplete; inspect main.xml')
          print(f"SpotBugs analyzed {summary.get('total_classes')} classes; bugs: {summary.get('total_bugs')}")
          PY
      - name: Update NVD database from feed
        id: nvd-update
        timeout-minutes: 25
        run: ./gradlew dependencyCheckUpdate --no-daemon --console=plain --info
      - name: Save updated NVD database
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-feed-${{ runner.os }}-13-${{ github.run_id }}-${{ github.run_attempt }}
      - name: SCA — OWASP Dependency-Check
        timeout-minutes: 10
        run: ./gradlew dependencyCheckAnalyze --no-daemon --console=plain
        env:
          SONATYPE_GUIDE_TOKEN: ${{ secrets.SONATYPE_GUIDE_TOKEN }}
      - name: Upload test and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-sast-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
            build/reports/spotbugs/
          if-no-files-found: error
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/dependency-check-report.*
          if-no-files-found: error
