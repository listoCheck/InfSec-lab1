spring.application.name=InfSec-lab1
spring.datasource.url=jdbc:h2:mem:secureapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.sql.init.mode=always
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
app.jwt.expiration-minutes=30
